name: Documentation

# Pull requests that change the library but not the documentation are
# checked against the documentation by the "ASan, BLAS, examples" job of
# CI.yml. Pushes also rebuild the documentation for changes of the library,
# so that the published documentation follows main.
on:
  pull_request:
    paths:
      - 'doc/**'
      - 'Makefile.in'
      - '.github/workflows/docs.yml'
  push:
    paths:
      - 'doc/**'
      - 'src/**'
      - 'configure.ac'
      - 'Makefile.in'
      - '.github/workflows/docs.yml'

concurrency:
  # Group by workflow and ref, and to limit to 1 concurrent job except for main
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  # Cancel intermediate builds for pull requests
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  #############################################################################
  # build documentation
  #############################################################################
  build-doc:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: "Setup"
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev autoconf libtool-bin nodejs
          python3 --version
          node --version

      - name: "Configure"
        run: |
          ./bootstrap.sh
          ./configure --disable-debug

      - name: "Build documentation"
        run: |
          cd doc
          python3 -m fdoc --strict build --redirects --out build/html

      - name: "Check the documentation and its example programs"
        run: |
          make -j$(expr $(nproc) + 1) library
          make checkdoc

      - name: "Setup LaTeX"
        if: github.repository == 'flintlib/flint' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra lmodern

      - name: "Build PDF documentation"
        if: github.repository == 'flintlib/flint' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd doc
          python3 -m fdoc latex --pdf --out build/latex

      - name: "Create a tarball of the documentation"
        if: github.repository == 'flintlib/flint' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd doc/build
          mv html doc
          cp latex/flint.pdf doc
          tar -czvf doc.tar.gz doc

      - name: "Setup SSH key"
        if: github.repository == 'flintlib/flint' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: shimataro/ssh-key-action@v2.7.0
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ secrets.KNOWN_HOSTS }}

      - name: "Push documentation to server"
        if: github.repository == 'flintlib/flint' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # a directory of its own for each run, so that an earlier failed or
          # concurrent run does not get in the way
          STAGE: tmp/flint-doc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cd doc/build
          ssh wbhart@opal6.opalstack.com "rm -rf ~/$STAGE && mkdir -p ~/$STAGE"
          scp doc.tar.gz wbhart@opal6.opalstack.com:$STAGE/
          # unpack next to the live copy, then replace it with two renames, so
          # that the site is never without documentation
          ssh wbhart@opal6.opalstack.com "set -e
            cd ~/$STAGE && tar -xzf doc.tar.gz
            cd ~/apps/flintlib_org
            rm -rf doc.new doc.old
            mv ~/$STAGE/doc doc.new
            if [ -d doc ]; then mv doc doc.old; fi
            mv doc.new doc
            rm -rf doc.old ~/$STAGE"
